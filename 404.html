<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Has despertado | Sivoleck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #05000a;
      --glow-red: rgba(139, 0, 0, 0.6);
      --neon-cyan: #00f3ff;
      --blood: #b30d08;
      --flesh: #1a0206;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom,
        #030008 0%,
        #0d0117 26%,
        #23030f 52%,
        #54060c 76%,
        #9c0b06 100%);
      font-family: 'JetBrains Mono', monospace;
      color: #aaa;
      cursor: none;
    }

    /* ── Cursor ── */
    #cursor-dot {
      position: fixed;
      width: 9px; height: 9px;
      background: radial-gradient(circle, #ff3a24 25%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px #ff1d00, 0 0 16px rgba(255,0,0,0.35);
    }

    /* ── Lienzos ── */
    #abyss, #ground {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #abyss  { z-index: 1; transform-origin: 50% 33%; animation: breathe 17s ease-in-out infinite; }
    #ground { z-index: 1; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.035); }
    }

    /* ── CRT ── */
    .crt {
      position: fixed; inset: 0; z-index: 500;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 2px,
        rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 3px
      );
      animation: crt-flicker 8s infinite;
    }
    @keyframes crt-flicker {
      0%, 97%, 100% { opacity: 1; }
      97.5% { opacity: 0.85; }
      98.5% { opacity: 0.7; }
      99% { opacity: 1; }
    }

    /* ── Viñeta ── */
    .vignette {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at 50% 33%,
        transparent 12%,
        rgba(0,0,0,0.35) 45%,
        rgba(0,0,0,0.82) 78%,
        rgba(0,0,0,0.96) 100%
      );
    }

    /* ── Ruido ── */
    .noise {
      position: fixed; inset: 0;
      z-index: 4; pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Eclipses / halos tras el ojo ── */
    .eye-halo {
      position: fixed;
      top: 33%; left: 50%;
      width: min(1100px, 190vw);
      height: min(1100px, 190vw);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at center,
        rgba(255,60,20,0.20) 0%,
        rgba(170,10,50,0.14) 26%,
        rgba(70,0,40,0.10) 48%,
        transparent 68%
      );
      pointer-events: none; z-index: 2;
      animation: halo-pulse 7s ease-in-out infinite;
    }
    @keyframes halo-pulse {
      0%, 100% { opacity: 0.7; transform: translate(-50%,-50%) scale(1); }
      50%      { opacity: 1;   transform: translate(-50%,-50%) scale(1.06); }
    }

    /* ── Ojo ── */
    .eye-container {
      position: fixed;
      top: 33%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      transition: translate 0.7s ease-out;
      animation: eye-drift 21s ease-in-out infinite;
      width: min(680px, 96vw);
      height: min(400px, 60vw);
      filter: drop-shadow(0 0 40px rgba(255,30,0,0.28)) drop-shadow(0 0 120px rgba(120,0,20,0.45));
    }
    @keyframes eye-drift {
      0%, 100% { margin-left: 0;    margin-top: 0; }
      50%      { margin-left: -8px; margin-top: 6px; }
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Ascuas rojas repartidas por la carne ── */
    .embers { position: fixed; top: 33%; left: 50%; z-index: 9; pointer-events: none; }
    .embers span {
      position: absolute;
      left: var(--x); top: var(--y);
      width: 5px; height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd9d2 0%, #ff3b16 40%, rgba(255,0,0,0) 72%);
      box-shadow: 0 0 10px rgba(255,40,10,0.75), 0 0 26px rgba(255,0,0,0.35);
      animation: ember 3.4s ease-in-out infinite;
      animation-delay: var(--d);
    }
    @keyframes ember {
      0%, 100% { opacity: 0.25; transform: scale(0.7); }
      45%      { opacity: 1;    transform: scale(1.15); }
    }

    /* ── Textos ── */
    .title-404 {
      position: fixed;
      top: 6%; left: 50%;
      transform: translateX(-50%);
      font-family: 'VT323', monospace;
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: #3d0a0a;
      letter-spacing: 0.4em;
      z-index: 20;
      user-select: none;
      text-shadow: 0 0 30px rgba(255,40,0,0.22), 0 0 70px rgba(120,0,0,0.4);
    }

    .status-line {
      position: fixed;
      top: 16%; left: 50%;
      transform: translateX(-50%);
      font-family: 'VT323', monospace;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      color: #4a1010;
      letter-spacing: 0.15em;
      z-index: 20;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 0 14px rgba(0,0,0,0.9);
    }
    .status-line .blink-cursor { animation: blink-c 1s step-end infinite; }
    @keyframes blink-c {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    .eye-phrase {
      position: fixed;
      bottom: 23%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'VT323', monospace;
      font-size: clamp(1.05rem, 3vw, 1.6rem);
      color: #ff6a52;
      text-align: center;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.8s ease;
      text-shadow: 0 0 12px rgba(0,0,0,0.95), 0 0 26px rgba(255,40,0,0.5);
      max-width: 82%;
      letter-spacing: 0.05em;
      pointer-events: none;
    }
    .eye-phrase.visible { opacity: 1; }

    .sleep-btn {
      position: fixed;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-decoration: none;
      color: #e7b7ad;
      padding: 10px 28px;
      border: 1px solid #6d1a13;
      background: rgba(8, 0, 6, 0.55);
      backdrop-filter: blur(3px);
      z-index: 20;
      transition: all 0.4s ease;
      cursor: none;
    }
    .sleep-btn:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0,243,255,0.25), 0 0 30px rgba(0,243,255,0.12);
      text-shadow: 0 0 8px rgba(0,243,255,0.4);
    }

    .whisper {
      position: fixed;
      font-family: 'VT323', monospace;
      font-size: 0.8rem;
      color: #5d1512;
      z-index: 5;
      pointer-events: none;
      letter-spacing: 0.1em;
      text-shadow: 0 0 12px rgba(0,0,0,0.85);
    }
    .whisper-tl { top: 5%; left: 4%; animation: w-fade 10s ease-in-out infinite; }
    .whisper-tr { top: 8%; right: 4%; text-align: right; animation: w-fade 10s 2.5s ease-in-out infinite; }
    .whisper-bl { bottom: 6%; left: 4%; animation: w-fade 10s 5s ease-in-out infinite; }
    .whisper-br { bottom: 4%; right: 4%; text-align: right; animation: w-fade 10s 7.5s ease-in-out infinite; }
    @keyframes w-fade {
      0%, 100% { opacity: 0; color: #3a0c0a; }
      40%, 60% { opacity: 1; color: #7d211a; }
    }

    .sleep-overlay {
      position: fixed; inset: 0;
      background: #000;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }
    .sleep-overlay.active { opacity: 1; pointer-events: all; }

    @media (prefers-reduced-motion: reduce) {
      #abyss, .eye-container, .eye-halo, .embers span { animation: none !important; }
    }

    @media (max-width: 500px) {
      .whisper { display: none; }
      .status-line { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="abyss"></canvas>
  <canvas id="ground"></canvas>
  <div class="eye-halo"></div>

  <div class="embers">
    <span style="--x:-215px; --y:-70px;  --d:0s"></span>
    <span style="--x:-160px; --y:-135px; --d:1.1s"></span>
    <span style="--x:-25px;  --y:-185px; --d:2.2s"></span>
    <span style="--x:120px;  --y:-160px; --d:0.7s"></span>
    <span style="--x:205px;  --y:-85px;  --d:1.8s"></span>
    <span style="--x:250px;  --y:-15px;  --d:2.9s"></span>
  </div>

  <div class="eye-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <div class="title-404">4 0 4</div>
  <div class="status-line">SIVOLECK_OS // ERROR: PAGE_NOT_FOUND // STATUS: <span style="color:#b31212">AWAKE</span><span class="blink-cursor">█</span></div>

  <div class="eye-phrase" id="eye-phrase"></div>

  <a href="index.html" class="sleep-btn" id="sleep-btn">[ Volver a dormir ]</a>

  <div class="whisper whisper-tl">// s á n a l o . . .</div>
  <div class="whisper whisper-tr">// &lt; &gt; v &lt; &gt; v</div>
  <div class="whisper whisper-bl">// la canción...</div>
  <div class="whisper whisper-br">// despierta del sueño</div>

  <div class="sleep-overlay" id="sleep-overlay"></div>

  <script>
  (function() {
    'use strict';

    /* ══════════════════════════════════════════
       ABISMO — tentáculos, rayos y figura lejana
    ══════════════════════════════════════════ */
    const abyss   = document.getElementById('abyss');
    const actx    = abyss.getContext('2d');
    const ground  = document.getElementById('ground');
    const gctx    = ground.getContext('2d');
    const DPR     = Math.min(window.devicePixelRatio || 1, 2);

    let W = 0, H = 0, EX = 0, EY = 0, EW = 0;

    /* Ruido reproducible: la forma es siempre la misma */
    function seeded(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
    }

    function ribbon(ctx, pts, w0, taper) {
      const left = [], right = [];
      const n = pts.length - 1;
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const w = Math.max(0.7, w0 * Math.pow(1 - t, taper) * Math.min(1, 0.12 + t * 7));
        const a = pts[Math.max(0, i - 1)];
        const b = pts[Math.min(n, i + 1)];
        let dx = b.x - a.x, dy = b.y - a.y;
        const l = Math.hypot(dx, dy) || 1;
        dx /= l; dy /= l;
        left.push([pts[i].x - dy * w * 0.5, pts[i].y + dx * w * 0.5]);
        right.push([pts[i].x + dy * w * 0.5, pts[i].y - dx * w * 0.5]);
      }
      ctx.beginPath();
      ctx.moveTo(left[0][0], left[0][1]);
      for (let i = 1; i < left.length; i++) ctx.lineTo(left[i][0], left[i][1]);
      for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
      ctx.closePath();
    }

    function tendril(rand, x0, y0, ang, len, w0, bow, cA, cB, taper, rim) {
      const steps = 22, pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const r = len * t;
        const jitter = (i === 0 || i === steps) ? 0 : (rand() - 0.5) * len * 0.05;
        const a = ang + (rand() - 0.5) * 0.045;
        const sw = bow * Math.sin(Math.PI * t) + jitter;
        pts.push({
          x: x0 + Math.cos(a) * r - Math.sin(a) * sw,
          y: y0 + Math.sin(a) * r + Math.cos(a) * sw,
        });
      }
      ribbon(actx, pts, Math.max(1, w0), taper);
      const tip = pts[pts.length - 1];
      const gr = actx.createLinearGradient(x0, y0, tip.x, tip.y);
      gr.addColorStop(0, cA);
      gr.addColorStop(1, cB);
      actx.fillStyle = gr;
      actx.fill();
      actx.strokeStyle = rim;
      actx.lineWidth = 1.1;
      actx.stroke();
      return pts;
    }

    function buildAbyss() {
      W = window.innerWidth; H = window.innerHeight;
      EX = W / 2; EY = H * 0.33;
      EW = Math.min(680, W * 0.96);

      abyss.width  = Math.floor(W * DPR);
      abyss.height = Math.floor(H * DPR);
      actx.setTransform(DPR, 0, 0, DPR, 0, 0);
      actx.clearRect(0, 0, W, H);

      const rand = seeded(20260913);
      const R = Math.max(W, H);

      /* Resplandor del ojo */
      const haze = actx.createRadialGradient(EX, EY, 0, EX, EY, R * 0.8);
      haze.addColorStop(0,    'rgba(255,54,14,0.22)');
      haze.addColorStop(0.16, 'rgba(160,10,44,0.17)');
      haze.addColorStop(0.45, 'rgba(70,4,44,0.11)');
      haze.addColorStop(1,    'rgba(0,0,0,0)');
      actx.fillStyle = haze;
      actx.fillRect(0, 0, W, H);

      /* Rayos de luz entre la carne */
      actx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 18; i++) {
        const a = rand() * Math.PI * 2;
        const w = 0.012 + rand() * 0.05;
        const len = R * 0.95;
        const rg = actx.createLinearGradient(EX, EY, EX + Math.cos(a) * len, EY + Math.sin(a) * len);
        rg.addColorStop(0, 'rgba(255,74,24,0.12)');
        rg.addColorStop(1, 'rgba(255,20,0,0)');
        actx.fillStyle = rg;
        actx.beginPath();
        actx.moveTo(EX, EY);
        actx.lineTo(EX + Math.cos(a - w) * len, EY + Math.sin(a - w) * len);
        actx.lineTo(EX + Math.cos(a + w) * len, EY + Math.sin(a + w) * len);
        actx.closePath();
        actx.fill();
      }
      actx.globalCompositeOperation = 'source-over';

      /* Hilachas lejanas */
      for (let i = 0; i < 110; i++) {
        const a = -Math.PI + (i / 110) * Math.PI + (rand() - 0.5) * 0.08;
        tendril(rand, EX, EY, a, R * (0.22 + rand() * 0.6), 4 + rand() * 8,
                (rand() - 0.5) * R * 0.3, 'rgba(62,8,34,0.75)', 'rgba(10,0,10,0)', 2.4, 'rgba(150,20,20,0.09)');
      }

      /* Garras principales: parten de un anillo alrededor del ojo */
      const main = [];
      const RING = EW * 0.34;
      for (let i = 0; i < 26; i++) {
        const a = -Math.PI + (i / 25) * Math.PI + (rand() - 0.5) * 0.09;
        const len = R * (0.28 + rand() * 0.45);
        const w0 = (58 + rand() * 120) * Math.min(1, W / 1000 + 0.4);
        main.push({
          a, len,
          pts: tendril(rand, EX + Math.cos(a) * RING * 0.25, EY + Math.sin(a) * RING * 0.22,
                       a, len, w0, (rand() - 0.5) * len * 0.26,
                       '#45060c', '#07000a', 1.35, 'rgba(200,32,14,0.26)'),
        });
      }

      /* Ramificaciones */
      main.forEach(m => {
        const branches = 1 + Math.floor(rand() * 3);
        for (let k = 0; k < branches; k++) {
          const p = m.pts[Math.floor(m.pts.length * (0.24 + rand() * 0.42))];
          const a = m.a + (rand() < 0.5 ? -1 : 1) * (0.35 + rand() * 0.7);
          tendril(rand, p.x, p.y, a, m.len * (0.14 + rand() * 0.26), 16 + rand() * 34,
                  (rand() - 0.5) * 40, '#38040b', '#060007', 1.7, 'rgba(200,32,14,0.2)');
        }
      });

      /* Cortina de carne bajo el ojo */
      for (let i = 0; i < 18; i++) {
        const x0 = EX + (rand() - 0.5) * EW * 0.95;
        const y0 = EY + 30 + rand() * 40;
        tendril(rand, x0, y0, Math.PI / 2 + (rand() - 0.5) * 0.3, 70 + rand() * 170,
                14 + rand() * 28, (rand() - 0.5) * 22, '#4b0608', '#14010a', 2.3, 'rgba(200,32,14,0.22)');
      }

      /* Goteos */
      for (let i = 0; i < 7; i++) {
        const x0 = EX + (rand() - 0.5) * EW * 0.7;
        const y0 = EY + 55 + rand() * 45;
        const len = 90 + rand() * 190;
        const pts = tendril(rand, x0, y0, Math.PI / 2 + (rand() - 0.5) * 0.12, len,
                            5 + rand() * 7, (rand() - 0.5) * 12, '#5c0708', '#1b0008', 3, 'rgba(200,30,14,0.22)');
        if (rand() > 0.45) {
          const tip = pts[pts.length - 1];
          const rr = 3 + rand() * 3.5;
          const dg = actx.createRadialGradient(tip.x, tip.y + rr * 1.4, 0, tip.x, tip.y + rr * 1.4, rr * 2.6);
          dg.addColorStop(0, 'rgba(215,40,22,0.95)');
          dg.addColorStop(1, 'rgba(90,4,4,0)');
          actx.fillStyle = dg;
          actx.beginPath();
          actx.arc(tip.x, tip.y + rr * 1.4, rr * 2.6, 0, Math.PI * 2);
          actx.fill();
        }
      }

      /* Siluetas en primer plano */
      const claws = [
        { x: -60,    y: H * 0.62, a: -0.32 },
        { x: W + 60, y: H * 0.62, a: -Math.PI + 0.32 },
        { x: -80,    y: H * 1.05, a: -0.85 },
        { x: W + 80, y: H * 1.05, a: -Math.PI + 0.85 },
      ];
      claws.forEach(c => {
        tendril(rand, c.x, c.y, c.a, R * 0.75, 70 + rand() * 70, R * 0.05,
                '#180206', '#0a0004', 1.05, 'rgba(170,24,10,0.14)');
      });

      /* Ascuas entre la carne */
      actx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 8; i++) {
        const a = -Math.PI + rand() * Math.PI;
        const r = EW * (0.42 + rand() * 0.95);
        const x = EX + Math.cos(a) * r;
        const y = EY + Math.sin(a) * r * 0.75;
        const dg = actx.createRadialGradient(x, y, 0, x, y, 18);
        dg.addColorStop(0, 'rgba(255,140,120,0.85)');
        dg.addColorStop(0.28, 'rgba(255,40,20,0.45)');
        dg.addColorStop(1, 'rgba(255,0,0,0)');
        actx.fillStyle = dg;
        actx.beginPath(); actx.arc(x, y, 18, 0, Math.PI * 2); actx.fill();
        actx.fillStyle = 'rgba(255,225,215,0.9)';
        actx.beginPath(); actx.arc(x, y, 1.7, 0, Math.PI * 2); actx.fill();
      }
      actx.globalCompositeOperation = 'source-over';
    }

    function buildGround() {
      ground.width  = Math.floor(W * DPR);
      ground.height = Math.floor(H * DPR);
      gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      gctx.clearRect(0, 0, W, H);

      /* Bruma roja del suelo */
      const haze = gctx.createLinearGradient(0, H * 0.5, 0, H);
      haze.addColorStop(0,    'rgba(120,6,4,0)');
      haze.addColorStop(0.55, 'rgba(200,22,8,0.4)');
      haze.addColorStop(1,    'rgba(255,72,26,0.55)');
      gctx.fillStyle = haze;
      gctx.fillRect(0, H * 0.5, W, H * 0.5);

      /* Figura diminuta mirando al ojo */
      const s = Math.max(0.8, Math.min(1.7, H / 760));
      const fx = W * 0.66, fy = H * 0.95;
      gctx.fillStyle = '#080003';
      gctx.strokeStyle = 'rgba(255,70,34,0.45)';
      gctx.lineWidth = 1.1;
      /* piernas */
      gctx.beginPath();
      gctx.moveTo(fx - 3.2 * s, fy - 6 * s); gctx.lineTo(fx - 4.6 * s, fy + 30 * s);
      gctx.lineTo(fx - 1.2 * s, fy + 30 * s); gctx.lineTo(fx - 0.4 * s, fy + 2 * s);
      gctx.lineTo(fx + 0.4 * s, fy + 2 * s);  gctx.lineTo(fx + 1.2 * s, fy + 30 * s);
      gctx.lineTo(fx + 4.6 * s, fy + 30 * s); gctx.lineTo(fx + 3.2 * s, fy - 6 * s);
      gctx.closePath(); gctx.fill(); gctx.stroke();
      /* torso y brazos */
      gctx.beginPath();
      gctx.moveTo(fx - 4.4 * s, fy - 27 * s);
      gctx.quadraticCurveTo(fx - 7.6 * s, fy - 18 * s, fx - 6.4 * s, fy - 2 * s);
      gctx.lineTo(fx - 2.6 * s, fy - 4 * s);
      gctx.lineTo(fx - 2 * s, fy - 20 * s);
      gctx.lineTo(fx + 2 * s, fy - 20 * s);
      gctx.lineTo(fx + 2.6 * s, fy - 4 * s);
      gctx.lineTo(fx + 6.4 * s, fy - 2 * s);
      gctx.quadraticCurveTo(fx + 7.6 * s, fy - 18 * s, fx + 4.4 * s, fy - 27 * s);
      gctx.closePath(); gctx.fill(); gctx.stroke();
      /* cabeza */
      gctx.beginPath();
      gctx.arc(fx, fy - 32 * s, 5.2 * s, 0, Math.PI * 2);
      gctx.fill(); gctx.stroke();
    }

    let resizeTimer = null;
    function rebuild() {
      buildAbyss();
      buildGround();
    }
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(rebuild, 160);
    });
    rebuild();

    /* ══════════════════════════════════════════
       THREE.JS OJO 3D
    ══════════════════════════════════════════ */
    const eyeBox = document.querySelector('.eye-container');
    const canvas3D = document.getElementById('three-canvas');
    const cursorEl = document.getElementById('cursor-dot');
    
    // Setup Three.js scene
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
    renderer.setSize(canvas3D.clientWidth, canvas3D.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const camera = new THREE.PerspectiveCamera(45, canvas3D.clientWidth / canvas3D.clientHeight, 0.1, 100);
    camera.position.z = 5.5;

    const eyeGeometry = new THREE.SphereGeometry(2, 64, 64);
    
    const vertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    
    const fragmentShader = `
      uniform float time;
      varying vec2 vUv;
      varying vec3 vNormal;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                   mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
      }

      void main() {
        vec2 uv = vUv;
        vec2 center = vec2(0.5, 0.5);
        float dist = distance(uv, center);
        
        vec3 color = vec3(0.0);
        
        vec3 scleraColor = vec3(0.6, 0.05, 0.05); // blood red edges
        vec3 scleraCenter = vec3(0.95, 0.85, 0.85);
        float veinNoise = noise(uv * 40.0 + time * 0.2) * noise(uv * 15.0);
        vec3 veins = vec3(0.7, 0.0, 0.0) * smoothstep(0.4, 0.7, veinNoise) * 1.5;
        
        color = mix(scleraCenter, scleraColor, smoothstep(0.0, 0.5, dist)) - veins;
        
        float irisRadius = 0.18;
        if(dist < irisRadius) {
          float f = noise(uv * 60.0 - time * 0.3);
          vec3 irisOuter = vec3(0.9, 0.2, 0.0);
          vec3 irisInner = vec3(1.0, 0.7, 0.1);
          color = mix(irisInner, irisOuter, dist / irisRadius);
          color += f * vec3(0.4, 0.1, 0.0);
          
          float pupilPulse = sin(time * 1.5) * 0.015;
          if(dist < 0.06 + pupilPulse) {
            color = vec3(0.0);
          }
        }
        
        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
        float spec = pow(max(dot(vNormal, lightDir), 0.0), 40.0);
        color += vec3(1.0) * spec * 0.7;
        
        float edge = 1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0));
        color *= (1.0 - pow(edge, 4.0));

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const eyeUniforms = { time: { value: 0.0 } };
    const eyeMaterial = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: eyeUniforms
    });

    const eyeMesh = new THREE.Mesh(eyeGeometry, eyeMaterial);
    eyeMesh.rotation.y = -Math.PI / 2;
    scene.add(eyeMesh);

    let mouseX = 0;
    let mouseY = 0;
    let targetRotationX = 0;
    let targetRotationY = 0;

    function track(clientX, clientY, moveCursor) {
      if (moveCursor) {
        cursorEl.style.left = clientX + 'px';
        cursorEl.style.top  = clientY + 'px';
      }
      
      mouseX = (clientX / window.innerWidth) * 2 - 1;
      mouseY = -(clientY / window.innerHeight) * 2 + 1;
      
      targetRotationY = -mouseX * 0.7;
      targetRotationX = mouseY * 0.4;

      const px = (clientX / window.innerWidth - 0.5) * 2;
      const py = (clientY / window.innerHeight - 0.5) * 2;
      abyss.style.translate  = `${(-px * 9).toFixed(1)}px ${(-py * 7).toFixed(1)}px`;
      eyeBox.style.translate = `${(-px * 4).toFixed(1)}px ${(-py * 3).toFixed(1)}px`;
    }

    document.addEventListener('mousemove', e => track(e.clientX, e.clientY, true));
    document.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (t) track(t.clientX, t.clientY, false);
    }, { passive: true });

    const clock = new THREE.Clock();
    function animateEye() {
      requestAnimationFrame(animateEye);
      eyeUniforms.time.value = clock.getElapsedTime();
      
      eyeMesh.rotation.y += (targetRotationY - eyeMesh.rotation.y - Math.PI/2) * 0.12;
      eyeMesh.rotation.x += (targetRotationX - eyeMesh.rotation.x) * 0.12;
      
      renderer.render(scene, camera);
    }
    animateEye();

    window.addEventListener('resize', () => {
      if(canvas3D.clientWidth > 0 && canvas3D.clientHeight > 0) {
        camera.aspect = canvas3D.clientWidth / canvas3D.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas3D.clientWidth, canvas3D.clientHeight);
      }
    });

    /* ══════════════════════════════════════════
       OCARINA PUZZLE - SONG OF HEALING
    ══════════════════════════════════════════ */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playOcarinaNote(freq) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 1.0);
    }

    const noteFreqs = {
      'ArrowLeft': 493.88, // B4
      'ArrowRight': 440.00, // A4
      'ArrowDown': 349.23  // F4
    };

    const targetSequence = ['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowDown'];
    let currentSequence = [];

    document.addEventListener('keydown', (e) => {
      if (noteFreqs[e.key]) {
        playOcarinaNote(noteFreqs[e.key]);
        currentSequence.push(e.key);
        
        if (currentSequence.length > targetSequence.length) {
          currentSequence.shift();
        }
        
        if (currentSequence.length === targetSequence.length && currentSequence.every((val, index) => val === targetSequence[index])) {
          healAndExit();
        }
      }
    });

    const overlay  = document.getElementById('sleep-overlay');
    function healAndExit() {
      overlay.style.background = '#ffffff';
      overlay.style.transition = 'opacity 2s ease-in';
      overlay.classList.add('active');
      
      abyss.style.transition  = 'opacity 1.5s ease';
      abyss.style.opacity     = '0';
      ground.style.transition = 'opacity 1.5s ease';
      ground.style.opacity    = '0';
      
      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
    }

    /* ══════════════════════════════════════════
       FRASES
    ══════════════════════════════════════════ */
    const PHRASES = [
      '¿Pensabas que podías escapar?',
      'No existe esta página. Ni tú tampoco.',
      'Has despertado... pero ¿de qué?',
      'La pesadilla era más cómoda, ¿verdad?',
      'Sánalo con la melodía...',
      'Toca la canción...',
      '¿Conoces la Canción de Curación?',
      'Te observo desde antes de que llegaras.',
      'Podrías volver a dormir... o tocar la ocarina.',
      'El ojo no parpadea. Tú sí.',
      '< > v < > v',
      'El sueño terminó. Esto es lo que queda.'
    ];

    let phraseIndex = 0;
    const phraseEl = document.getElementById('eye-phrase');

    function showNextPhrase() {
      phraseEl.classList.remove('visible');
      setTimeout(() => {
        phraseEl.textContent = PHRASES[phraseIndex];
        phraseEl.classList.add('visible');
        phraseIndex = (phraseIndex + 1) % PHRASES.length;
      }, 800);
    }
    setTimeout(() => {
      showNextPhrase();
      setInterval(showNextPhrase, 5000);
    }, 1500);

    /* ══════════════════════════════════════════
       VOLVER A DORMIR
    ══════════════════════════════════════════ */
    const sleepBtn = document.getElementById('sleep-btn');

    sleepBtn.addEventListener('click', e => {
      e.preventDefault();
      overlay.style.background = '#000000';
      overlay.style.transition = 'opacity 1.5s ease';
      overlay.classList.add('active');
      abyss.style.transition  = 'opacity 1.5s ease';
      abyss.style.opacity     = '0';
      ground.style.transition = 'opacity 1.5s ease';
      ground.style.opacity    = '0';
      setTimeout(() => { window.location.href = 'index.html'; }, 2100);
    });

  })();
  </script>

</body>
